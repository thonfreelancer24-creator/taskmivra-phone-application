name: TaskMivra Voice v0.7 Corpus Fetch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/taskmivra-voice-v07-corpus-fetch.yml'
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  fetch-public-domain-speakers:
    if: github.event_name != 'issues' || github.event.issue.title == 'TaskMivra Voice v0.7 corpus fetch'
    runs-on: ubuntu-latest
    steps:
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl

      - name: Stream compact public-domain LibriVox clips
        shell: bash
        run: |
          set -eu
          mkdir -p corpus/wav16
          fetch_clip() {
            src="$1"; out="$2"
            url="https://commons.wikimedia.org/wiki/Special:Redirect/file/${src}"
            curl -L --fail --retry 2 --max-time 120 "$url" 2>/dev/null | \
              ffmpeg -hide_banner -loglevel error -y -i pipe:0 -t 60 -ac 1 -ar 16000 -c:a pcm_s16le "corpus/wav16/${out}.wav"
            test -s "corpus/wav16/${out}.wav"
          }
          fetch_clip 'LibriVox_-_The_Case_of_Lady_Sannox.ogg' betsie_bush
          fetch_clip 'Morella_poe_mt.ogg' lady_maria
          fetch_clip 'Sleeping_beauty_in_the_wood_perrault_rjs.ogg' rebecca_snyder
          fetch_clip 'LibriVox_-_Constitution_of_the_United_States_of_America_01.ogg' kristen_mcquillin
          fetch_clip 'Ransom_red_chief_henry_ce.ogg' catharine_eastman
          fetch_clip 'Yellow_wallpaper_gilman_lr.ogg' lola_rogers
          fetch_clip 'LibriVox_-_The_Red_Room_by_H._G._Wells.ogg' william_coon
          fetch_clip 'Shortstory026_goodmatch_jc.ogg' james_christopher
          fetch_clip 'LibriVox_-_A_Modest_Proposal.ogg' john_gonzales
          fetch_clip 'Gs006_hauntedhouse_woolf_dgf.ogg' david_federman
          fetch_clip 'Gs006_redroom_wells_v.ogg' virgil
          fetch_clip 'LibriVox_-_Peter_and_Wendy_17.ogg' john_garvin
          sha256sum corpus/wav16/* > corpus/SHA256SUMS.txt

      - name: Write provenance
        shell: bash
        run: |
          cat > corpus/PROVENANCE.json <<'JSON'
          {
            "purpose": "TaskMivra Voice v0.7 rights-clean speaker diversity training",
            "retrieved_utc": "2026-08-28",
            "production_training_rights": "public-domain",
            "policy": "Only LibriVox recordings hosted by Wikimedia Commons and represented as public-domain are included. Preserve source-page evidence before production release.",
            "speakers": ["Betsie Bush","Lady Maria","Rebecca Snyder","Kristen McQuillin","Catharine Eastman","Lola Rogers","William Coon","James Christopher","John Gonzales","David Federman","Virgil","John Garvin"],
            "source_pages": [
              "https://commons.wikimedia.org/wiki/File:LibriVox_-_The_Case_of_Lady_Sannox.ogg",
              "https://commons.wikimedia.org/wiki/File:Morella_poe_mt.ogg",
              "https://commons.wikimedia.org/wiki/File:Sleeping_beauty_in_the_wood_perrault_rjs.ogg",
              "https://commons.wikimedia.org/wiki/File:LibriVox_-_Constitution_of_the_United_States_of_America_01.ogg",
              "https://commons.wikimedia.org/wiki/File:Ransom_red_chief_henry_ce.ogg",
              "https://commons.wikimedia.org/wiki/File:Yellow_wallpaper_gilman_lr.ogg",
              "https://commons.wikimedia.org/wiki/File:LibriVox_-_The_Red_Room_by_H._G._Wells.ogg",
              "https://commons.wikimedia.org/wiki/File:Shortstory026_goodmatch_jc.ogg",
              "https://commons.wikimedia.org/wiki/File:LibriVox_-_A_Modest_Proposal.ogg",
              "https://commons.wikimedia.org/wiki/File:Gs006_hauntedhouse_woolf_dgf.ogg",
              "https://commons.wikimedia.org/wiki/File:Gs006_redroom_wells_v.ogg",
              "https://commons.wikimedia.org/wiki/File:LibriVox_-_Peter_and_Wendy_17.ogg"
            ]
          }
          JSON

      - name: Upload compact corpus
        uses: actions/upload-artifact@v4
        with:
          name: taskmivra-v07-public-domain-speakers-12-streamed
          path: |
            corpus/wav16/*.wav
            corpus/PROVENANCE.json
            corpus/SHA256SUMS.txt
          retention-days: 7
