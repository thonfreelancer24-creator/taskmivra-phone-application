<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>Ignite Event Attendance</title>
<style>
:root{color-scheme:dark;--bg:#07070a;--panel:#100d13;--panel2:#18111d;--red:#f21d2b;--red2:#9f0d16;--gold:#d8b43e;--text:#f6f2f2;--muted:#aaa4ad;--line:#3d3741;--green:#39b96d}*{box-sizing:border-box}html{min-height:100%;background:var(--bg);-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:radial-gradient(circle at 86% 12%,rgba(242,29,43,.16),transparent 31%),linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px),var(--bg);background-size:auto,80px 80px,80px 80px,auto;color:var(--text);font-family:Inter,Arial,sans-serif}button,input,select{font:inherit;touch-action:manipulation}.shell{width:min(1320px,calc(100% - 34px));margin:auto}.topbar{border-bottom:1px solid #252129;background:rgba(7,7,10,.96)}.topinner{min-height:92px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:15px;min-width:0}.brand img{width:78px;height:78px;object-fit:contain;border-radius:6px;background:#07070a}.brandname{font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;color:var(--gold);font-size:19px;letter-spacing:.08em;white-space:nowrap}.ghost,.primary,.mini{border-radius:9px;font-weight:900;cursor:pointer;-webkit-tap-highlight-color:transparent}.ghost{min-height:48px;padding:0 18px;border:2px solid #aca6af;background:#09090b;color:white}.primary{min-height:56px;padding:0 24px;border:0;background:linear-gradient(135deg,var(--red2),#ff1d2c);color:white}.hero{display:grid;grid-template-columns:1.02fr .98fr;gap:54px;align-items:start;padding:46px 0}.pill{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(242,29,43,.42);border-radius:999px;padding:10px 15px;color:#ff5966;font-size:11px;letter-spacing:.14em}.dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}h1,.big,.card h2,.dashHero h1,.panel h2,.stat strong{font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif}.big{font-size:clamp(58px,6.5vw,96px);line-height:.92;margin:28px 0}.big em{font-style:normal;color:var(--red)}.lead{font-family:Georgia,serif;color:#bbb3bd;font-size:18px;line-height:1.7;max-width:680px}.facts{display:flex;border-top:1px solid #39333c;margin-top:38px;padding-top:24px}.fact{flex:1}.fact+.fact{border-left:1px solid #39333c;padding-left:24px}.fact strong{display:block;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;font-size:26px}.fact span{display:block;color:#87818a;font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-top:5px}.card,.panel,.dashHero,.stat{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),#0a090c);border-radius:20px}.card{overflow:hidden;box-shadow:0 28px 80px rgba(0,0,0,.35)}.cardbar{min-height:60px;background:#1b1320;border-bottom:1px solid #4a424d;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--gold);font-size:10px;letter-spacing:.16em}.cardbody{position:relative;padding:32px}.cardbody:before,.cardbody:after{content:'';position:absolute;width:26px;height:26px;pointer-events:none}.cardbody:before{left:16px;top:16px;border-left:3px solid var(--gold);border-top:3px solid var(--gold)}.cardbody:after{right:16px;bottom:16px;border-right:3px solid var(--gold);border-bottom:3px solid var(--gold)}.kicker{margin:0 0 7px;color:var(--gold);font-size:10px;font-weight:900;letter-spacing:.16em}.card h2,.panel h2{font-size:34px;margin:4px 0}.muted{color:var(--muted);line-height:1.55}.field{display:block;margin-top:16px;color:#ddd6df;font-size:11px;letter-spacing:.1em;font-weight:800}.field input,.field select,.filters input,.filters select{display:block;width:100%;min-height:54px;margin-top:7px;border:1px solid #433c46;border-radius:10px;background:#08070a;color:#fff;padding:0 14px;font-size:17px;outline:none}.field input:focus,.field select:focus,.filters input:focus,.filters select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,180,62,.09)}.record{display:flex;gap:12px;align-items:flex-start;margin-top:17px;border:1px solid rgba(216,180,62,.28);background:#120e0a;border-radius:10px;padding:15px}.record input{width:24px;height:24px;accent-color:var(--red);flex:0 0 auto}.record strong{font-size:14px}.record small{display:block;color:#8e8990;line-height:1.45;margin-top:5px}.full{width:100%;margin-top:18px}.notice{margin-top:14px;padding:13px 14px;border-radius:10px;font-size:14px;line-height:1.45}.ok{background:#0e1b12;border:1px solid #2d7d49;color:#d9f3df}.bad{background:#1e0d10;border:1px solid #a51923;color:#ffd9dd}.successBox{margin-top:18px;padding:22px;border:1px solid rgba(57,185,109,.45);border-radius:14px;background:rgba(24,99,53,.15);text-align:center}.successBox h3{margin:0 0 8px;font-size:26px}.successBox p{color:#b9d7c3}.login{width:min(570px,calc(100% - 28px));margin:54px auto}.dash{padding:28px 0 48px}.dashHero{padding:22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.dashHero h1{font-size:42px;margin:4px 0}.backend{border:1px solid #454047;border-radius:999px;padding:9px 12px;color:#aaa;font-size:11px;white-space:nowrap}.backend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.stat{padding:15px}.stat span{display:block;color:#8c858e;font-size:10px;text-transform:uppercase;letter-spacing:.1em}.stat strong{display:block;font-size:31px;margin-top:4px}.panel{padding:20px;margin-top:12px}.panelhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .primary,.actions .ghost{min-height:46px;font-size:12px;padding:0 14px}.filters{display:grid;grid-template-columns:1fr 170px 190px;gap:9px;margin-top:15px}.filters input,.filters select{margin-top:0;min-height:50px;font-size:15px}.tableWrap{overflow:auto;border:1px solid #302a33;border-radius:10px;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:11px;border-bottom:1px solid #2b2630;font-size:13px}th{background:#130e15;color:var(--gold);font-size:10px;text-transform:uppercase}.status{display:inline-block;border:1px solid #48414c;border-radius:999px;padding:4px 8px}.rowActions{display:flex;gap:6px;flex-wrap:wrap}.mini{min-height:34px;padding:0 9px;border:1px solid #514a54;background:#18151a;color:white;font-size:11px}.mini.gold{background:var(--gold);border-color:var(--gold);color:#111}.recordSave{display:grid;grid-template-columns:1fr 190px;gap:10px;align-items:end}.footer{border-top:1px solid #28232b;padding:20px 0 32px;color:#68626b;font-size:10px;letter-spacing:.13em;text-align:center;margin-top:16px}.hidden{display:none!important}@media(min-width:900px) and (max-width:1180px){.shell{width:calc(100% - 28px)}.topinner{min-height:96px}.brand img{width:84px;height:84px}.hero{grid-template-columns:minmax(0,.82fr) minmax(440px,1.18fr);gap:24px;padding:28px 0 34px}.big{font-size:clamp(50px,6.2vw,70px);margin:20px 0}.lead{font-size:16px;line-height:1.55}.facts{margin-top:24px;padding-top:17px}.fact+.fact{padding-left:12px}.fact strong{font-size:21px}.fact span{font-size:9px}.cardbody{padding:28px 25px}.field input,.field select{min-height:58px;font-size:18px}.primary{min-height:60px;font-size:16px}.record input{width:26px;height:26px}.stats{grid-template-columns:repeat(5,1fr);gap:7px}.stat{padding:12px}.stat strong{font-size:27px}.filters{grid-template-columns:minmax(0,1fr) 145px 175px}.tableWrap{overflow:visible;border:0}table{display:block;min-width:0}thead{display:none}tbody{display:grid;gap:11px}tbody tr{display:grid;grid-template-columns:1fr 1fr;background:#0a090c;border:1px solid #39333d;border-radius:14px;overflow:hidden}tbody td{display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:8px;padding:12px 13px;font-size:14px}tbody td:before{content:attr(data-label);color:var(--gold);font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}tbody td:first-child,tbody td:last-child{grid-column:1/-1}.mini{min-height:46px;font-size:12px;flex:1 1 auto}}
@media(min-width:700px) and (max-width:899px){.shell{width:calc(100% - 28px)}.topinner{min-height:92px}.brand img{width:80px;height:80px}.hero{grid-template-columns:1fr;gap:22px;padding:24px 0}.hero-copy{text-align:center}.pill{font-size:10px}.big{font-size:62px;margin:20px 0}.lead{font-size:17px;margin-left:auto;margin-right:auto}.facts{max-width:680px;margin:24px auto 0}.card{width:min(690px,100%);margin:auto}.cardbody{padding:31px 30px}.field input,.field select{min-height:60px;font-size:18px}.primary{min-height:62px;font-size:16px}.record{padding:17px}.record input{width:26px;height:26px}.login{width:min(650px,calc(100% - 38px));margin:42px auto}.stats{grid-template-columns:repeat(5,1fr);gap:7px}.stat{padding:12px 10px}.stat strong{font-size:26px}.dashHero{align-items:flex-start}.filters{grid-template-columns:1fr}.tableWrap{overflow:visible;border:0}table{display:block;min-width:0}thead{display:none}tbody{display:grid;gap:11px}tbody tr{display:block;background:#0a090c;border:1px solid #39333d;border-radius:14px;overflow:hidden}tbody td{display:grid;grid-template-columns:105px minmax(0,1fr);gap:8px;align-items:center;padding:12px 13px;font-size:14px}tbody td:before{content:attr(data-label);color:var(--gold);font-size:9px;font-weight:900;text-transform:uppercase}.mini{min-height:46px;font-size:12px;flex:1 1 42%}.recordSave{grid-template-columns:1fr}}
@media(max-width:699px){.shell{width:calc(100% - 20px)}.topinner{min-height:76px}.brand img{width:58px;height:58px}.brandname{font-size:13px}.ghost{min-height:44px;padding:0 10px;font-size:12px}.hero{grid-template-columns:1fr;gap:22px;padding:24px 0}.pill{font-size:9px;padding:8px 10px;white-space:normal}.big{font-size:54px;margin:20px 0}.lead{font-size:16px}.facts{display:block;margin-top:22px;padding-top:14px}.fact+.fact{border-left:0;border-top:1px solid #39333c;padding:12px 0 0;margin-top:12px}.cardbar{font-size:8px;padding:0 12px}.cardbody{padding:26px 19px}.card h2{font-size:29px}.field input,.field select{min-height:56px}.stats{grid-template-columns:1fr 1fr}.dashHero,.panelhead{flex-direction:column;align-items:flex-start}.filters,.recordSave{grid-template-columns:1fr}.tableWrap{overflow:visible;border:0}table{display:block;min-width:0}thead{display:none}tbody{display:grid;gap:10px}tbody tr{display:block;background:#0a090c;border:1px solid #39333d;border-radius:12px;overflow:hidden}tbody td{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;align-items:center;padding:11px 12px;font-size:13px}tbody td:before{content:attr(data-label);color:var(--gold);font-size:8px;font-weight:900;text-transform:uppercase}.mini{min-height:44px;flex:1 1 45%}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API='https://kptxfknlvzoulzuzppzs.supabase.co/functions/v1/ignite-attendance';
const LOGO='https://kptxfknlvzoulzuzppzs.supabase.co/functions/v1/ignite-logo';
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(path,options={}){const token=sessionStorage.getItem('ignite_staff_token');const headers={'Content-Type':'application/json',...(options.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(API+path,{...options,headers});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function header(staff=false){return `<header class="topbar"><div class="shell topinner"><div class="brand"><img src="${LOGO}" alt="IBC Ignite Business Consulting"><span class="brandname">DISPATCH CLASSES</span></div><button class="ghost" id="navBtn">${staff?'Participant Check-In':'Staff Access'}</button></div></header>`}
function participant(){document.title='Ignite Event Check-In';app.innerHTML=header(false)+`<main class="shell hero"><section class="hero-copy"><div class="pill"><span class="dot"></span>GROUP CLASS · AUGUST 29, 2026</div><div class="big">EVENT<br>ATTENDANCE.<br><em>CHECK IN HERE.</em></div><p class="lead">Welcome to Natalie Martinez's live dispatch training. Confirm your attendance and let Ignite know if you would like the recording after the event.</p><div class="facts"><div class="fact"><strong>LIVE</strong><span>Instructor Guidance</span></div><div class="fact"><strong>REAL</strong><span>Dispatch Workflows</span></div><div class="fact"><strong>IGNITE</strong><span>Business Mindset</span></div></div></section><section class="card"><div class="cardbar"><span>ATTENDANCE</span><span>IGNITE BUSINESS CONSULTING</span></div><div class="cardbody"><p class="kicker">OFFICIAL EVENT CHECK-IN</p><h2>CONFIRM YOUR ATTENDANCE</h2><p class="muted">Enter your own information below. Your attendance is saved directly to the event roster.</p><form id="checkinForm"><label class="field">FULL NAME<input id="fullName" autocomplete="name" maxlength="100" required placeholder="Enter your full name"></label><label class="field">EMAIL ADDRESS<input id="email" type="email" inputmode="email" autocomplete="email" maxlength="150" required placeholder="you@example.com"></label><label class="field">ATTENDANCE TYPE<select id="mode"><option value="In Person">In Person</option><option value="Zoom">Zoom</option></select></label><label class="record"><input id="recording" type="checkbox"><span><strong>Send me the recording link after the event</strong><small>Choose this if you want Ignite to include you on the recording recipient list.</small></span></label><div id="notice"></div><button class="primary full" id="submitBtn" type="submit">CONFIRM CHECK-IN →</button></form><div id="successBox" class="hidden"></div></div></section></main><footer class="shell footer">IGNITE BUSINESS CONSULTING LLC · EVENT ATTENDANCE</footer>`;document.getElementById('navBtn').onclick=()=>location.hash='staff';document.getElementById('checkinForm').onsubmit=async e=>{e.preventDefault();if(!e.target.reportValidity())return;const btn=document.getElementById('submitBtn'),notice=document.getElementById('notice');notice.innerHTML='';btn.disabled=true;btn.textContent='CHECKING IN…';try{const d=await call('/checkin',{method:'POST',body:JSON.stringify({full_name:document.getElementById('fullName').value,email:document.getElementById('email').value,attendance_mode:document.getElementById('mode').value,recording_requested:document.getElementById('recording').checked})});e.target.classList.add('hidden');const box=document.getElementById('successBox');box.className='successBox';box.innerHTML=`<h3>✓ CHECK-IN COMPLETE</h3><p>${esc(d.message||'Your attendance has been recorded.')}</p><button class="primary" id="nextPerson">READY FOR NEXT ATTENDEE</button>`;document.getElementById('nextPerson').onclick=()=>participant()}catch(err){notice.innerHTML=`<div class="notice bad">${esc(err.message)}</div>`}finally{btn.disabled=false;btn.textContent='CONFIRM CHECK-IN →'}}}
function login(){document.title='Ignite Staff Attendance';app.innerHTML=header(true)+`<main class="login"><section class="card"><div class="cardbar"><span>PRIVATE ACCESS</span><span>IGNITE BUSINESS CONSULTING</span></div><div class="cardbody"><p class="kicker">AUTHORIZED STAFF ONLY</p><h2>ATTENDANCE DESK</h2><p class="muted">Sign in to view the live roster, recording requests, and exports.</p><form id="loginForm"><label class="field">USERNAME<input id="username" autocomplete="username" autocapitalize="none" required></label><label class="field">PASSWORD<input id="password" type="password" autocomplete="current-password" required></label><div id="loginNotice"></div><button class="primary full" id="loginBtn">LOG IN →</button></form></div></section></main>`;document.getElementById('navBtn').onclick=()=>location.hash='';if(sessionStorage.getItem('ignite_staff_token')){location.hash='dashboard';return}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='LOGGING IN…';try{const d=await call('/staff/login',{method:'POST',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});sessionStorage.setItem('ignite_staff_token',d.token);location.hash='dashboard'}catch(err){document.getElementById('loginNotice').innerHTML=`<div class="notice bad">${esc(err.message)}</div>`}finally{b.disabled=false;b.textContent='LOG IN →'}}}
let rows=[];function download(data,name){const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const csv=data.map(r=>r.map(q).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}
async function dashboard(){if(!sessionStorage.getItem('ignite_staff_token')){location.hash='staff';return}document.title='Ignite Attendance Dashboard';app.innerHTML=header(true)+`<main class="shell dash"><section class="panel"><p class="muted">Loading live attendance…</p></section></main>`;try{const d=await call('/staff/dashboard');rows=d.attendees||[];app.innerHTML=header(true)+`<main class="shell dash"><section class="dashHero"><div><p class="kicker">IGNITE BUSINESS CONSULTING · EVENT CONTROL</p><h1>ATTENDANCE DASHBOARD</h1><p class="muted">Group Class · August 29, 2026 · ${esc(d.staff.display_name||'Ignite Staff')}</p></div><div class="backend"><i></i>Backend Connected</div></section><section class="stats"><article class="stat"><span>Registered</span><strong>${d.counts.registered}</strong></article><article class="stat"><span>Present</span><strong>${d.counts.present}</strong></article><article class="stat"><span>Pending</span><strong>${d.counts.pending}</strong></article><article class="stat"><span>Absent</span><strong>${d.counts.absent}</strong></article><article class="stat"><span>Recording</span><strong>${d.counts.recording}</strong></article></section><section class="panel"><div class="panelhead"><div><p class="kicker">LIVE ROSTER</p><h2>PARTICIPANT RECORDS</h2></div><div class="actions"><button class="primary" id="exportAll">Export Attendance</button><button class="ghost" id="exportRec">Recording Requests</button></div></div><div class="filters"><input id="search" placeholder="Search name or email"><select id="status"><option value="all">All Statuses</option><option>Present</option><option>Pending</option><option>Absent</option></select><select id="rec"><option value="all">All Recording Choices</option><option value="yes">Recording Requested</option><option value="no">Not Requested</option></select></div><div id="dashNotice"></div><div class="tableWrap"><table><thead><tr><th>Participant</th><th>Attendance</th><th>Status</th><th>Check-In</th><th>Recording</th><th>Actions</th></tr></thead><tbody id="roster"></tbody></table></div></section><section class="panel"><p class="kicker">POST-EVENT</p><h2>RECORDING DISTRIBUTION</h2><div class="recordSave"><label class="field" style="margin-top:0">RECORDING LINK<input id="recordingUrl" type="url" inputmode="url" value="${esc(d.event.recording_url||'')}" placeholder="Paste recording URL after the event"></label><button class="primary" id="saveRec">Save Recording Link</button></div><div id="recNotice"></div></section></main><footer class="shell footer">IGNITE BUSINESS CONSULTING LLC · STAFF ATTENDANCE</footer>`;document.getElementById('navBtn').textContent='Log Out';document.getElementById('navBtn').onclick=async()=>{try{await call('/staff/logout',{method:'POST',body:'{}'})}catch{}sessionStorage.removeItem('ignite_staff_token');location.hash='staff'};const render=()=>{const q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('status').value,r=document.getElementById('rec').value;const f=rows.filter(x=>(!q||(x.full_name+' '+x.email).toLowerCase().includes(q))&&(s==='all'||x.status===s)&&(r==='all'||(x.recording_requested?'yes':'no')===r));document.getElementById('roster').innerHTML=f.length?f.map(x=>`<tr><td data-label="Participant"><strong>${esc(x.full_name)}</strong><br><span class="muted">${esc(x.email)}</span></td><td data-label="Attendance">${esc(x.attendance_mode)}</td><td data-label="Status"><span class="status">${esc(x.status)}</span></td><td data-label="Check-In">${esc(new Date(x.checked_in_at).toLocaleString())}</td><td data-label="Recording">${x.recording_requested?'Requested':'—'}</td><td data-label="Actions"><div class="rowActions"><button class="mini" data-id="${esc(x.id)}" data-act="present">Present</button><button class="mini" data-id="${esc(x.id)}" data-act="absent">Absent</button><button class="mini" data-id="${esc(x.id)}" data-act="pending">Pending</button><button class="mini gold" data-id="${esc(x.id)}" data-act="recording">${x.recording_requested?'Remove Recording':'Add Recording'}</button></div></td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;color:#777;padding:28px">No participants match this filter.</td></tr>'};render();['search','status','rec'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));document.getElementById('roster').onclick=async e=>{const b=e.target.closest('[data-act]');if(!b)return;b.disabled=true;try{await call('/staff/action',{method:'POST',body:JSON.stringify({id:b.dataset.id,action:b.dataset.act})});await dashboard()}catch(err){document.getElementById('dashNotice').innerHTML=`<div class="notice bad">${esc(err.message)}</div>`}};document.getElementById('exportAll').onclick=()=>download([['Full Name','Email','Attendance Type','Status','Check-In Time','Recording Requested'],...rows.map(x=>[x.full_name,x.email,x.attendance_mode,x.status,x.checked_in_at,x.recording_requested?'YES':'NO'])],'ignite-attendance.csv');document.getElementById('exportRec').onclick=()=>download([['Full Name','Email','Attendance Type','Status','Check-In Time'],...rows.filter(x=>x.recording_requested).map(x=>[x.full_name,x.email,x.attendance_mode,x.status,x.checked_in_at])],'ignite-recording-requests.csv');document.getElementById('saveRec').onclick=async()=>{const n=document.getElementById('recNotice');try{await call('/staff/recording-url',{method:'POST',body:JSON.stringify({recording_url:document.getElementById('recordingUrl').value})});n.innerHTML='<div class="notice ok">✓ Recording link saved.</div>'}catch(err){n.innerHTML=`<div class="notice bad">${esc(err.message)}</div>`}}}catch(err){if(/Unauthorized/i.test(err.message)){sessionStorage.removeItem('ignite_staff_token');location.hash='staff'}else app.innerHTML=header(true)+`<main class="shell dash"><div class="notice bad">${esc(err.message)}</div></main>`}}
function route(){const h=location.hash.slice(1);if(h==='staff')login();else if(h==='dashboard')dashboard();else participant()}window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
