[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmivra-crystal-voice"
version = "0.4.0"
description = "Offline, profile-conditioned target-speaker extraction laboratory"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }

[project.scripts]
crystal-voice = "crystal_voice.cli:main"

# Limit package discovery to the application package. The installer creates a
# runtime/ directory at the repository root, which must never be treated as a
# Python package during editable installation.
[tool.setuptools.packages.find]
where = ["."]
include = ["crystal_voice*"]
exclude = ["runtime*"]
namespaces = false

[tool.setuptools.package-data]
crystal_voice = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
